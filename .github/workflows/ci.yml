name: Fleet Management CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pydantic pytest

      - name: Code Linting & Static Analysis (Ruff)
        run: ruff check fleet_management

  unit-and-integration-tests:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Start Docker Services
        run: |
          docker compose up -d --build

      - name: Wait for Backend & Services Initialization
        run: |
          echo "Waiting for services to initialize..."
          sleep 15
          docker compose ps

      - name: Execute Full Pytest Test Suite inside Container
        run: |
          docker compose exec -T backend /home/frappe/frappe-bench/env/bin/pytest apps/fleet_management/fleet_management/tests -v

      - name: Tear Down Environment
        if: always()
        run: docker compose down

  docker-build:
    name: Docker Environment Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config
