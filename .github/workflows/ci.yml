name: Fleet Management CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Code Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pydantic pytest

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall fleet_management

      - name: Static Code Analysis (Ruff)
        run: |
          ruff check fleet_management || true

  unit-and-integration-tests:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build & Launch Container Stack
        run: |
          docker compose up -d --build

      - name: Verify Container Health & Status
        run: |
          sleep 10
          docker compose ps

      - name: Tear Down Container Environment
        if: always()
        run: docker compose down

  docker-build:
    name: Docker Environment Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config
